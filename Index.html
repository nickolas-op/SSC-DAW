<!DOCTYPE html>
<html lang="bt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC</title>
    <link rel="icon" type="image/png" href="IMG/logo-removebg.png">
    <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>
    <section class="Cabeçario">
        <img id="Logo" src="IMG/logo-removebg.png" alt="Logo">
        <h1 id="Titulo">
        Simple Sequence Cycle
        </h1>
    

    </section>
    
    <section class="Principal">
        <div class="Bloco-1">
        <p id="Pri-1">
            Simple Sequence Cycle é uma DAW (interface de audio digital)
            que feita para rodar no seu browser, sem login, sem conta.
            Apenas música, sem restrições pronto para a sua criatividade.
            
        </p>

        <img id="Pri-2" src="/IMG/Stock1.png" alt="Imagem de um homem tocando um teclado MIDI">

        </div>

        <div class="Bloco-2">

        <img id="Pri-3" src="IMG/sequencer.png" alt="Imagem do sequênciador SSC">

        <p id="Pri-4">
            Um sequênciador simples e moderno, criado para facilitar a 
            criação das suas beats
        </p>

    </div>

    </section>
    

</body>
</html>
